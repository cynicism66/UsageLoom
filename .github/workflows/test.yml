name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/codex-plugin
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: legacy/codex-plugin/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate project
        run: npm run validate
      - name: Run tests
        run: npm test
